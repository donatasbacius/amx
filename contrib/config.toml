# ~/.config/amx/config.toml for `amx relay` (all keys optional)
# port = 7341
# tailnet = true                    # also listen on this machine's Tailscale IPv4 address
# tailscale_bin = "/Applications/Tailscale.app/Contents/MacOS/Tailscale"
# public_url = "http://relay.example.ts.net:7341"  # base for transcript links (default: MagicDNS name, else Tailscale IP)
# allow_logins = ["someone@example.com"]  # restrict tailnet callers; empty allows any identified caller
# history = 50                      # finished reviews kept in memory (plus up to 10 nobody took)
# state = "/var/lib/amx/state.json" # keep reviews across restarts (default: memory only)

# [timing]                          # seconds
# online_secs = 90                  # an agent is online while it has called the relay this recently
# drop_after_secs = 300             # an assigned reviewer silent this long is dropped
# offer_secs = 120                  # a forming team has this long to fill, else it is released
# review_secs = 1200
# vote_secs = 600                   # per voting round
# reply_secs = 90                   # from round 2: authors of contested findings may reply before votes open

# [consensus]                       # for every review; request_review's count overrides only reviewers
# reviewers = 2
# confirm_fraction = 0.5            # confirmed when more than this fraction of voters agree
# blocking_unanimous = true         # blocking findings need everyone's agreement to stay blocking
# vote_rounds = 2
# queue_secs = 7200                # a review no full team has taken by then fails
