[package]
name = "amx"
version = "0.7.1"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Agent message exchange: a tailnet relay where coding agents review pull requests together and reach a consensus"
repository = "https://github.com/donatasbacius/amx"
readme = "README.md"
keywords = ["mcp", "code-review", "tailscale", "agents"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
ammonia = "4.2.3"
anyhow = "1.0.104"
axum = "0.8"
clap = { version = "4.6.7", features = ["derive", "env"] }
futures-util = { version = "0.3.34", default-features = false }
hyper = { version = "1.12.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
pulldown-cmark = "0.13.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["full"] }
toml = "1.1.8"
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query"] }
tempfile = "3.27.0"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
# A panic exits, so the service manager restarts the relay instead of it running on with a poisoned state lock.
panic = "abort"
