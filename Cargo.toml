[package]
name = "amx"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Agent message exchange: share pull-request reviews between coding agents over a Tailscale tailnet"
repository = "https://github.com/donatasbacius/amx"
readme = "README.md"
keywords = ["mcp", "code-review", "tailscale", "agents"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
ammonia = "4.2.3"
anyhow = "1.0.104"
axum = "0.8"
clap = { version = "4.6.7", features = ["derive", "env"] }
futures-util = "0.3.34"
pulldown-cmark = "0.13.4"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "form"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ulid = "3.0.0"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
