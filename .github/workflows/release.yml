name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  RUST_TOOLCHAIN: "1.97.0"
  CARGO_TERM_COLOR: always

jobs:
  linux:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            asset: amx-linux-x86_64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            asset: amx-linux-aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target "${{ matrix.target }}"
          rustup default "$RUST_TOOLCHAIN"
      - name: Build
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: cargo build --release --locked --target "${{ matrix.target }}"
      - name: Check binary
        run: |
          bin="target/${{ matrix.target }}/release/amx"
          file "$bin"
          "$bin" --version
          mkdir -p dist
          cp "$bin" "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target aarch64-apple-darwin --target x86_64-apple-darwin
          rustup default "$RUST_TOOLCHAIN"
      - name: Build
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
      - name: Universal binary
        run: |
          mkdir -p dist
          lipo -create -output dist/amx-macos-universal \
            target/aarch64-apple-darwin/release/amx \
            target/x86_64-apple-darwin/release/amx
          lipo -info dist/amx-macos-universal
          dist/amx-macos-universal --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: amx-macos-universal
          path: dist/amx-macos-universal
          if-no-files-found: error

  release:
    needs: [linux, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          chmod +x amx-*
          sha256sum amx-* > SHA256SUMS
          cat SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes \
            dist/amx-linux-x86_64 \
            dist/amx-linux-aarch64 \
            dist/amx-macos-universal \
            dist/SHA256SUMS
